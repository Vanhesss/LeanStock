openapi: 3.0.3
info:
  title: LeanStock API
  description: Inventory Management System for Sneaker Retail Chain
  version: 2.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
    PaginationMeta:
      type: object
      properties:
        limit:
          type: integer
        total:
          type: integer
        cursor:
          type: string
          nullable: true
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: "manager@leanstock.kz"
        firstName:
          type: string
          example: "Arman"
        lastName:
          type: string
          example: "Bekturov"
        role:
          type: string
          enum: [ADMIN, MANAGER, STAFF]
        locationId:
          type: string
          format: uuid
          nullable: true
        isActive:
          type: boolean
        isEmailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Returns JWT access and refresh tokens. Requires verified email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@leanstock.kz"
                password:
                  type: string
                  example: "Password123!"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials or email not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user (Admin/Manager only)
      description: Creates user and sends verification email. User must verify before login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName, role]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                  enum: [MANAGER, STAFF]
                locationId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: User created, verification email sent
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden — insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  example: "64-character-hex-token"
      responses:
        "200":
          description: Email verified successfully
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      description: Always returns success to prevent email enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@leanstock.kz"
      responses:
        "200":
          description: Reset email sent (if account exists)
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  example: "NewPassword123!"
      responses:
        "200":
          description: Password reset successfully
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New token pair
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke tokens)
      responses:
        "200":
          description: Successfully logged out
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /products:
    get:
      tags: [Products]
      summary: List products (cursor-based pagination)
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: brandId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Product list
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Products]
      summary: Create product with variants (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brandId, model, colorway, msrpPrice, sizes]
              properties:
                brandId:
                  type: string
                  format: uuid
                model:
                  type: string
                  example: "Air Force 1"
                colorway:
                  type: string
                  example: "Triple White"
                msrpPrice:
                  type: integer
                  example: 55000
                sizes:
                  type: array
                  items:
                    type: number
                  example: [38, 39, 40, 41, 42, 43, 44]
      responses:
        "201":
          description: Product created
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product details with variants
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Products]
      summary: Update product (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                colorway:
                  type: string
                msrpPrice:
                  type: integer
                isActive:
                  type: boolean
                excludeFromMarkdown:
                  type: boolean
      responses:
        "200":
          description: Product updated
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /inventory:
    get:
      tags: [Inventory]
      summary: List inventory at location
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: lowStock
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Inventory list
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /inventory/receive:
    post:
      tags: [Inventory]
      summary: Receive stock (Manager+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, items]
              properties:
                locationId:
                  type: string
                  format: uuid
                items:
                  type: array
                  items:
                    type: object
                    required: [variantId, quantity]
                    properties:
                      variantId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
      responses:
        "200":
          description: Stock received
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /inventory/adjust:
    post:
      tags: [Inventory]
      summary: Adjust stock with SELECT FOR UPDATE (Manager+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, locationId, adjustment, reason]
              properties:
                variantId:
                  type: string
                  format: uuid
                locationId:
                  type: string
                  format: uuid
                adjustment:
                  type: integer
                  description: Positive to add, negative to remove
                reason:
                  type: string
                  enum: [DAMAGE, THEFT, CORRECTION, SUPPLIER_ERROR, AUDIT]
      responses:
        "200":
          description: Stock adjusted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transfers:
    get:
      tags: [Transfers]
      summary: List transfers (Manager+)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, IN_TRANSIT, COMPLETED, CANCELLED]
        - name: locationId
          in: query
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Transfer list
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Transfers]
      summary: Create transfer request (Manager+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceLocationId, destLocationId, items]
              properties:
                sourceLocationId:
                  type: string
                  format: uuid
                destLocationId:
                  type: string
                  format: uuid
                items:
                  type: array
                  items:
                    type: object
                    required: [variantId, quantity]
                    properties:
                      variantId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                note:
                  type: string
      responses:
        "201":
          description: Transfer created
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transfers/{id}/approve:
    patch:
      tags: [Transfers]
      summary: Approve transfer (Manager+)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transfer approved
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not in PENDING status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transfers/{id}/reject:
    patch:
      tags: [Transfers]
      summary: Reject transfer (Manager+)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Transfer rejected
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not in PENDING status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transfers/{id}/ship:
    patch:
      tags: [Transfers]
      summary: Ship transfer (atomic stock decrement with SELECT FOR UPDATE)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transfer shipped, stock decremented at source
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not APPROVED or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transfers/{id}/receive:
    patch:
      tags: [Transfers]
      summary: Receive transfer (complete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transfer completed, stock incremented at destination
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not IN_TRANSIT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sales:
    get:
      tags: [Sales]
      summary: List sales (cursor pagination)
      parameters:
        - name: locationId
          in: query
          schema:
            type: string
            format: uuid
        - name: variantId
          in: query
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Sales list with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        sku:
                          type: string
                        productModel:
                          type: string
                        brandName:
                          type: string
                        quantity:
                          type: integer
                        unitPrice:
                          type: integer
                        totalPrice:
                          type: integer
                        soldBy:
                          type: string
                        locationName:
                          type: string
                        soldAt:
                          type: string
                          format: date-time
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Sales]
      summary: Record a sale (decrements inventory with SELECT FOR UPDATE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, locationId, quantity, unitPrice]
              properties:
                variantId:
                  type: string
                  format: uuid
                locationId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100
                  example: 1
                unitPrice:
                  type: integer
                  minimum: 1
                  description: Price in tenge (smallest currency unit)
                  example: 65000
      responses:
        "201":
          description: Sale recorded, inventory decremented
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Inventory record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sales/{id}:
    get:
      tags: [Sales]
      summary: Get sale by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sale details
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reservations:
    get:
      tags: [Reservations]
      summary: List reservations
      parameters:
        - name: locationId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, CONVERTED, CANCELLED, EXPIRED]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Reservations list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        sku:
                          type: string
                        productModel:
                          type: string
                        quantity:
                          type: integer
                        customerName:
                          type: string
                        customerPhone:
                          type: string
                          nullable: true
                        status:
                          type: string
                          enum: [ACTIVE, CONVERTED, CANCELLED, EXPIRED]
                        expiresAt:
                          type: string
                          format: date-time
                        locationName:
                          type: string
                        reservedBy:
                          type: string
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Reservations]
      summary: Create reservation (locks stock with SELECT FOR UPDATE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, locationId, customerName]
              properties:
                variantId:
                  type: string
                  format: uuid
                locationId:
                  type: string
                  format: uuid
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
                customerName:
                  type: string
                  example: "Alibek Nurlan"
                customerPhone:
                  type: string
                  example: "+77001234567"
      responses:
        "201":
          description: Reservation created, stock reserved
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Inventory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Insufficient available stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reservations/{id}/cancel:
    patch:
      tags: [Reservations]
      summary: Cancel reservation (releases reserved stock)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reservation cancelled, stock released
        "400":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reservations/{id}/convert:
    patch:
      tags: [Reservations]
      summary: Convert reservation to sale
      description: Converts an active reservation into a sale record, decrementing both onHand and reservedQuantity.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reservation converted to sale
        "400":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
