openapi: 3.0.3
info:
  title: LeanStock API
  description: |
    Inventory Management System for a multi-location sneaker retail chain.
    Provides full product catalog, inventory tracking, inter-location transfers,
    sales recording, reservations, dead stock decay, supplier management,
    purchase orders, demand forecasting, and admin management.
  version: 3.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: "VALIDATION_ERROR"
            message:
              type: string
              example: "Validation failed"
            details:
              type: object
    PaginationMeta:
      type: object
      properties:
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        cursor:
          type: string
          nullable: true
          example: "eyJpZCI6ImE1ZjMwMGE4LTRiNmItNGI1NC04YjRiLTk2NjA3N2Q3YzA5MSJ9"
    Supplier:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Nike Distribution KZ"
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "c3d1a8f0-4b6b-4b54-8b4b-966077d7c091"
        email:
          type: string
          format: email
          example: "manager@leanstock.kz"
        firstName:
          type: string
          example: "Arman"
        lastName:
          type: string
          example: "Bekturov"
        role:
          type: string
          enum: [ADMIN, MANAGER, STAFF]
          example: "MANAGER"
        locationId:
          type: string
          format: uuid
          nullable: true
          example: "b2f300a8-4b6b-4b54-8b4b-966077d7c091"
        isActive:
          type: boolean
          example: true
        isEmailVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-04-28T10:30:00.000Z"
paths:
  # ──────────── AUTH ────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Returns JWT access and refresh tokens. Requires verified email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@leanstock.kz"
                password:
                  type: string
                  example: "Password123!"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refreshToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials or email not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: "UNAUTHORIZED"
                  message: "Invalid email or password"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded (5 req/min per IP)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: "RATE_LIMIT_EXCEEDED"
                  message: "Too many requests, please try again later"

  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user (Admin/Manager only)
      description: Creates user and sends verification email. User must verify before login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName, role]
              properties:
                email:
                  type: string
                  format: email
                  example: "newstaff@leanstock.kz"
                password:
                  type: string
                  minLength: 8
                  example: "SecurePass456!"
                firstName:
                  type: string
                  example: "Daulet"
                lastName:
                  type: string
                  example: "Karimov"
                role:
                  type: string
                  enum: [MANAGER, STAFF]
                  example: "STAFF"
                locationId:
                  type: string
                  format: uuid
                  example: "b2f300a8-4b6b-4b54-8b4b-966077d7c091"
      responses:
        "201":
          description: User created, verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden — insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: "CONFLICT"
                  message: "A user with this email already exists"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  example: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Email verified successfully"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      description: Always returns success to prevent email enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@leanstock.kz"
      responses:
        "200":
          description: Reset email sent (if account exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "If an account exists with this email, a reset link has been sent"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  example: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
                password:
                  type: string
                  minLength: 8
                  example: "NewPassword123!"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Password reset successfully"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refreshToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "401":
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke tokens)
      responses:
        "200":
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Successfully logged out"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ──────────── PRODUCTS ────────────
  /products:
    get:
      tags: [Products]
      summary: List products (cursor-based pagination)
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            example: 20
        - name: brandId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Search by model name or SKU
          schema:
            type: string
            example: "Air Max"
        - name: isActive
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        model:
                          type: string
                          example: "Air Max 90"
                        colorway:
                          type: string
                          example: "White/Black"
                        msrpPrice:
                          type: integer
                          example: 65000
                        brand:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                              example: "Nike"
                        variants:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              sku:
                                type: string
                                example: "NIK-AIRM-WHI-A1B2C3D4-42"
                              size:
                                type: number
                                example: 42
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Products]
      summary: Create product with variants (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brandId, model, colorway, msrpPrice, sizes]
              properties:
                brandId:
                  type: string
                  format: uuid
                  example: "d1f300a8-4b6b-4b54-8b4b-966077d7c091"
                model:
                  type: string
                  example: "Dunk Low"
                colorway:
                  type: string
                  example: "Panda"
                msrpPrice:
                  type: integer
                  description: Price in tenge (smallest currency unit)
                  example: 55000
                sizes:
                  type: array
                  items:
                    type: number
                  example: [38, 39, 40, 41, 42, 43, 44, 45]
      responses:
        "201":
          description: Product created with auto-generated SKU variants
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Brand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product details with variants
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Products]
      summary: Update product (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  example: "Air Max 90 SE"
                colorway:
                  type: string
                  example: "Sail/Black"
                msrpPrice:
                  type: integer
                  example: 70000
                isActive:
                  type: boolean
                  example: true
                excludeFromMarkdown:
                  type: boolean
                  example: false
      responses:
        "200":
          description: Product updated
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ──────────── INVENTORY ────────────
  /inventory:
    get:
      tags: [Inventory]
      summary: List inventory at location
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: lowStock
          in: query
          description: Filter items with less than 3 units on hand
          schema:
            type: string
            enum: ["true", "false"]
        - name: search
          in: query
          description: Search by SKU, model, colorway, or location name
          schema:
            type: string
            example: "Air Max"
      responses:
        "200":
          description: Inventory list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        sku:
                          type: string
                          example: "NIK-AIRM-WHI-A1B2C3D4-42"
                        productModel:
                          type: string
                          example: "Air Max 90"
                        brandName:
                          type: string
                          example: "Nike"
                        size:
                          type: number
                          example: 42
                        onHand:
                          type: integer
                          example: 15
                        reservedQuantity:
                          type: integer
                          example: 2
                        available:
                          type: integer
                          example: 13
                        currentPrice:
                          type: integer
                          example: 65000
                        lastSoldAt:
                          type: string
                          format: date-time
                          nullable: true
                        locationName:
                          type: string
                          example: "Mega Alma-Ata Store"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/receive:
    post:
      tags: [Inventory]
      summary: Receive stock shipment (Manager+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, items]
              properties:
                locationId:
                  type: string
                  format: uuid
                  example: "b2f300a8-4b6b-4b54-8b4b-966077d7c091"
                items:
                  type: array
                  items:
                    type: object
                    required: [variantId, quantity]
                    properties:
                      variantId:
                        type: string
                        format: uuid
                        example: "e4f300a8-4b6b-4b54-8b4b-966077d7c091"
                      quantity:
                        type: integer
                        minimum: 1
                        example: 10
      responses:
        "200":
          description: Stock received
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Location or variant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inventory/adjust:
    post:
      tags: [Inventory]
      summary: Adjust stock with Serializable transaction (Manager+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, locationId, adjustment, reason]
              properties:
                variantId:
                  type: string
                  format: uuid
                  example: "e4f300a8-4b6b-4b54-8b4b-966077d7c091"
                locationId:
                  type: string
                  format: uuid
                  example: "b2f300a8-4b6b-4b54-8b4b-966077d7c091"
                adjustment:
                  type: integer
                  description: Positive to add, negative to remove
                  example: -2
                reason:
                  type: string
                  enum: [DAMAGE, THEFT, CORRECTION, SUPPLIER_ERROR, AUDIT]
                  example: "DAMAGE"
      responses:
        "200":
          description: Stock adjusted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Inventory record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Adjustment would result in negative stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: "CONFLICT"
                  message: "Adjustment would result in negative stock"
                  details:
                    currentOnHand: 5
                    adjustment: -10
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ──────────── TRANSFERS ────────────
  /transfers:
    get:
      tags: [Transfers]
      summary: List transfers (Manager+)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, IN_TRANSIT, COMPLETED, CANCELLED]
        - name: locationId
          in: query
          description: Filter by source or destination location
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Transfer list with pagination
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Transfers]
      summary: Create transfer request (Manager+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceLocationId, destLocationId, items]
              properties:
                sourceLocationId:
                  type: string
                  format: uuid
                  example: "b2f300a8-4b6b-4b54-8b4b-966077d7c091"
                destLocationId:
                  type: string
                  format: uuid
                  example: "c3f300a8-4b6b-4b54-8b4b-966077d7c091"
                items:
                  type: array
                  items:
                    type: object
                    required: [variantId, quantity]
                    properties:
                      variantId:
                        type: string
                        format: uuid
                        example: "e4f300a8-4b6b-4b54-8b4b-966077d7c091"
                      quantity:
                        type: integer
                        minimum: 1
                        example: 5
                note:
                  type: string
                  example: "Restocking Dostyk Plaza for weekend rush"
      responses:
        "201":
          description: Transfer created with PENDING status
        "400":
          description: Source and destination locations must be different
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Insufficient available stock at source location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transfers/{id}/approve:
    patch:
      tags: [Transfers]
      summary: Approve transfer (Manager+)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transfer approved
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
