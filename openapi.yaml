            type: string
            format: date-time
            example: "2026-05-01T00:00:00.000Z"
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
            example: "2026-05-31T23:59:59.000Z"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Sales list with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        sku:
                          type: string
                          example: "NIK-AIRM-WHI-A1B2C3D4-42"
                        productModel:
                          type: string
                          example: "Air Max 90"
                        brandName:
                          type: string
                          example: "Nike"
                        quantity:
                          type: integer
                          example: 1
                        unitPrice:
                          type: integer
                          example: 65000
                        totalPrice:
                          type: integer
                          example: 65000
                        soldBy:
                          type: string
                          example: "Arman Bekturov"
                        locationName:
                          type: string
                          example: "Mega Alma-Ata Store"
                        soldAt:
                          type: string
                          format: date-time
                          example: "2026-05-12T14:30:00.000Z"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Sales]
      summary: Record a sale (Serializable transaction with stock decrement)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, locationId, quantity, unitPrice]
              properties:
                variantId:
                  type: string
                  format: uuid
                  example: "e4f300a8-4b6b-4b54-8b4b-966077d7c091"
                locationId:
                  type: string
                  format: uuid
                  example: "b2f300a8-4b6b-4b54-8b4b-966077d7c091"
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100
                  example: 1
                unitPrice:
                  type: integer
                  minimum: 1
                  description: Price in tenge (smallest currency unit)
                  example: 65000
      responses:
        "201":
          description: Sale recorded, inventory decremented, confirmation email sent
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Inventory record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: "CONFLICT"
                  message: "Insufficient stock"
                  details:
                    available: 3
                    requested: 5
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

